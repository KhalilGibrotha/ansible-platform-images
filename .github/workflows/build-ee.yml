---
# Build the platform image fleet.
#
# EEs: ee-base is built first, then the derived EEs (primary, vmware, network)
# FROM that base by digest - "build once, promote by digest". They build
# sequentially in one job so the freshly built base is available locally to the
# derived builds without needing to publish it first (important for PR builds,
# which never push). The Dev Spaces authoring image builds on its own parallel
# job because it has a different lineage.
#
# Nothing is pushed on pull_request - a PR proves the images BUILD; publishing
# happens only on push to main.
name: build-ee

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: khalilgibrotha        # GHCR namespace (must be lowercase)

permissions:
  contents: read
  packages: write

jobs:
  # The in-cluster scripts cannot run here - a hosted runner has no cluster -
  # but their own logic can: a stub oc answers from a state directory and
  # records every call. Cheap, and it fails on a refusal the scripts claim
  # to make and no longer do.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell
        run: shellcheck -S style scripts/*.sh tests/*.sh
      - name: Behaviour tests against a stub oc
        run: bash tests/test-in-cluster-scripts.sh

  build-ees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build ee-base
        run: |
          ansible-builder build \
            --file base/execution-environment.yml \
            --context base/context \
            --container-runtime docker \
            --tag "$REGISTRY/$OWNER/ee-base:${{ github.sha }}" \
            --verbosity 2

      - name: Build derived EEs FROM the local base
        run: |
          for ee in primary vmware network; do
            echo "::group::build ee-$ee"
            ansible-builder build \
              --file "$ee/execution-environment.yml" \
              --context "$ee/context" \
              --container-runtime docker \
              --build-arg EE_BASE_IMAGE="$REGISTRY/$OWNER/ee-base:${{ github.sha }}" \
              --tag "$REGISTRY/$OWNER/ee-$ee:${{ github.sha }}" \
              --verbosity 2
            echo "::endgroup::"
          done

      - name: Push all EE images
        if: github.event_name != 'pull_request'
        run: |
          for img in ee-base ee-primary ee-vmware ee-network; do
            docker push "$REGISTRY/$OWNER/$img:${{ github.sha }}"
          done

  # Independent track: the Dev Spaces authoring images. They derive from the
  # Ansible devspaces image (not ee-base) and are plain Containerfile builds.
  # One Containerfile, two builds - see devspaces/README.md:
  #   ansible-devspaces          every client, enterprise base when configured
  #   ansible-devspaces-network  the network subset, community base, public
  build-devspaces:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ansible-devspaces
            requirements: full
          - image: ansible-devspaces-network
            requirements: network
    env:
      # The enterprise build derives from the supported image when the
      # repository is configured for it: a DEVSPACES_ENTERPRISE_BASE variable
      # naming the mirrored image by digest, and registry credentials in the
      # two secrets below. Unset, it builds from the community base like the
      # network image, which is the lab default. The public network image
      # never takes the override: entitled content stays private.
      #
      # GitHub withholds secrets from pull requests opened from forks and
      # from Dependabot, so for those the private base could never be
      # pulled and the enterprise check would always fail. They build from
      # the community base instead, and the job summary says so.
      SECRETS_WITHHELD: >-
        ${{ github.event_name == 'pull_request'
            && (github.event.pull_request.head.repo.full_name != github.repository
                || github.actor == 'dependabot[bot]') }}
      CONFIGURED_BASE: ${{ matrix.image == 'ansible-devspaces' && vars.DEVSPACES_ENTERPRISE_BASE || '' }}
      BASE_REGISTRY_USER: ${{ secrets.DEVSPACES_BASE_REGISTRY_USER }}
      BASE_REGISTRY_TOKEN: ${{ secrets.DEVSPACES_BASE_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the base
        run: |
          base="$CONFIGURED_BASE"
          if [ -n "$base" ] && [ "$SECRETS_WITHHELD" = "true" ]; then
            echo "::notice::Fork or Dependabot pull request: no registry secrets; ${{ matrix.image }} uses the community base"
            echo "${{ matrix.image }}: community base; this pull request cannot read the registry secrets." >> "$GITHUB_STEP_SUMMARY"
            base=""
          fi
          echo "ENTERPRISE_BASE=$base" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in to the enterprise base registry
        if: env.ENTERPRISE_BASE != '' && env.BASE_REGISTRY_USER != ''
        run: |
          registry="${ENTERPRISE_BASE%%/*}"
          echo "$BASE_REGISTRY_TOKEN" | docker login "$registry" -u "$BASE_REGISTRY_USER" --password-stdin

      - name: Build ${{ matrix.image }}
        run: |
          args=(--build-arg "REQUIREMENTS=${{ matrix.requirements }}")
          if [ -n "$ENTERPRISE_BASE" ]; then
            args+=(--build-arg "DEVSPACES_BASE=$ENTERPRISE_BASE")
          fi
          docker build \
            --file devspaces/Containerfile \
            "${args[@]}" \
            --label "org.opencontainers.image.title=${{ matrix.image }}" \
            --label "org.opencontainers.image.description=Ansible Dev Spaces authoring image, ${{ matrix.requirements }} client set" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$REGISTRY/$OWNER/${{ matrix.image }}:${{ github.sha }}" \
            devspaces/

      # An image derived from the entitled base never goes to ghcr.io: it is
      # built here to prove it builds, and published from inside the
      # organisation. The community-base images are the ones this job ships.
      - name: Note the enterprise image is not published here
        if: github.event_name != 'pull_request' && env.ENTERPRISE_BASE != ''
        run: |
          echo "${{ matrix.image }}: built from the enterprise base; not pushed to $REGISTRY." >> "$GITHUB_STEP_SUMMARY"

      - name: Push ${{ matrix.image }}
        if: github.event_name != 'pull_request' && env.ENTERPRISE_BASE == ''
        run: |
          docker push "$REGISTRY/$OWNER/${{ matrix.image }}:${{ github.sha }}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$OWNER/${{ matrix.image }}:${{ github.sha }}")"
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "Pin this in a devfile (tag for humans, digest for the kubelet):"
            echo
            echo '```text'
            echo "$REGISTRY/$OWNER/${{ matrix.image }}:${{ github.sha }}@${ref##*@}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
