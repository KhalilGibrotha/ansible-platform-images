; repo-align configuration for ansible-platform-images (source side).
; Consumed by adhoc-tools/repo-align/align.py. Safe to commit: it names
; paths and the source-to-target substitutions, nothing environment-specific
; beyond the repository mapping.

[align]
; Versioned so drift is reviewable in history. The pre-push hook in
; .githooks regenerates it; commit the refresh when the hook says so.
manifest    = .align/MANIFEST.txt

; Never leaves this repo: the alignment machinery itself (.align.conf would
; rewrite its own rule in transit), local editor and session state, and the
; bundle output directory.
exclude     = .align/ .githooks/ .align.conf
              .claude/ align-out/

; No file here carries front matter, so status gating never applies and
; everything tracked ships. Set deliberately so a future document with a
; status line does not get held back by surprise.
push_status = any

; Literal source-text = replacement, applied to text payloads on the way
; out, so this repo can hold the lab's public registry and forge while the
; target receives the organisation's. Hashes are computed AFTER rewriting.
;
; All rules stay commented until the internal values exist. The first
; rewrites the EE definitions and the README, where registry and namespace
; appear as one path. The workflow keeps its registry in a separate
; `REGISTRY:` value, so the second rule covers that line; the owner is
; derived from the repository at run time and needs no rule. Check the
; manifest diff after the first rewrite to see every line the rules touched.
[rewrite]
;ghcr.io/khalilgibrotha = <internal-registry>/<namespace>
;REGISTRY: ghcr.io = REGISTRY: <internal-registry>
;https://github.com/KhalilGibrotha/ansible-platform-images = https://github.com/<org>/<twin-repo>
